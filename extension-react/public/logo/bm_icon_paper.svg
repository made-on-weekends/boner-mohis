  <!-- A6 Standalone charge-bar glyph, soot-paper on transparent, dark surfaces. LOCKED E2 stepped-solid geometry. Segment w=230.0, gap=130.0, base band=200.0, heights=[430.0, 665.0, 900.0], glyph 950.0x900.0. Columns share one continuous base - this is what stops the battery reading (a battery's cells sit inside a casing, never on a shared floor) and the signal-bars reading (signal bars are always discrete). Segments ASCEND, which battery cells do not. Gap widened from 70 to 130 vs the Step 1 presentation so three segments still resolve at 16px - FLAGGED, not silent. Single-fill per element. The ember 'glow' is a COLOUR VALUE, never a filter, gradient or shadow. -->
