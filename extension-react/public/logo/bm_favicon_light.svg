  <!-- B5 Favicon, light - soot-paper ground. Container radius 12% of the tile = 12px at a 100px render, per DESIGN.md §5 base radius 12px. LOCKED E2 stepped-solid geometry. Segment w=230.0, gap=130.0, base band=200.0, heights=[430.0, 665.0, 900.0], glyph 950.0x900.0. Columns share one continuous base - this is what stops the battery reading (a battery's cells sit inside a casing, never on a shared floor) and the signal-bars reading (signal bars are always discrete). Segments ASCEND, which battery cells do not. Gap widened from 70 to 130 vs the Step 1 presentation so three segments still resolve at 16px - FLAGGED, not silent. -->
